<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 빌딩 관제 — 로그인</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f4;
      --bg-tertiary: #f0efed;
      --bg-info: #e6f1fb;
      --bg-danger: #fcebeb;
      --text-primary: #1a1a18;
      --text-secondary: #5f5e5a;
      --text-info: #185fa5;
      --text-danger: #a32d2d;
      --border: rgba(0,0,0,0.12);
      --border-info: rgba(24,95,165,0.3);
      --radius-md: 8px;
      --radius-lg: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1c1c1a;
        --bg-secondary: #252523;
        --bg-tertiary: #2c2c2a;
        --bg-info: #0c2a4a;
        --bg-danger: #2a0e0e;
        --text-primary: #e8e6df;
        --text-secondary: #9c9a92;
        --text-info: #85b7eb;
        --text-danger: #f09595;
        --border: rgba(255,255,255,0.1);
        --border-info: rgba(133,183,235,0.3);
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-wrap {
      width: 100%;
      max-width: 380px;
    }
    .login-header {
      margin-bottom: 2rem;
      text-align: center;
    }
    .login-header h1 {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .login-header p {
      font-size: 13px;
      color: var(--text-secondary);
    }
    .login-card {
      background: var(--bg-primary);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.75rem 1.5rem;
    }
    .field {
      margin-bottom: 1rem;
    }
    .field label {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .field input {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }
    .field input:focus {
      border-color: var(--border-info);
      background: var(--bg-info);
    }
    .error-msg {
      font-size: 12px;
      color: var(--text-danger);
      background: var(--bg-danger);
      border-radius: var(--radius-md);
      padding: 8px 12px;
      margin-bottom: 1rem;
      display: none;
    }
    .login-btn {
      width: 100%;
      padding: 11px;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: var(--radius-md);
      background: var(--text-info);
      color: #fff;
      cursor: pointer;
      transition: opacity 0.15s;
      font-family: inherit;
    }
    .login-btn:hover { opacity: 0.85; }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-header">
      <h1>스마트 빌딩 관제 대시보드</h1>
      <p>관리자 계정으로 로그인하세요</p>
    </div>
    <div class="login-card">
      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="admin@example.com" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호 입력" autocomplete="current-password">
      </div>
      <div class="error-msg" id="error-msg"></div>
      <button class="login-btn" id="login-btn" onclick="doLogin()">로그인</button>
    </div>
  </div>

  <script>
    const SERVER = 'http://localhost:8080';

    // 이미 로그인된 경우 대시보드로
    if (localStorage.getItem('iot_token')) {
      location.href = 'dashboard.html';
    }

    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('login-btn');
      const errEl    = document.getElementById('error-msg');

      errEl.style.display = 'none';

      if (!email || !password) {
        showError('이메일과 비밀번호를 입력해주세요.');
        return;
      }

      btn.disabled = true;
      btn.textContent = '로그인 중...';

      try {
        const res = await fetch(`${SERVER}/v1/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('iot_token', data.token);
          location.href = 'dashboard.html';
        } else {
          const err = await res.json().catch(() => ({}));
          showError(err.message || '이메일 또는 비밀번호가 올바르지 않습니다.');
        }
      } catch (e) {
        showError('서버에 연결할 수 없습니다.');
      } finally {
        btn.disabled = false;
        btn.textContent = '로그인';
      }
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
