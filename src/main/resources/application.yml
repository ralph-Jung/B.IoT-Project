spring:
  jackson:
    time-zone: UTC

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  datasource:
    url: jdbc:postgresql://localhost:5432/biot_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: ${TIMEZONE_IDENTIFIER}

  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/biot_db
    user: postgres
    password: postgres
    locations: classpath:db/migration
    default-schema: public
    repair-on-migrate: true

logging:
  level:
    org.flywaydb: DEBUG
  file:
    name: ./logs/iot-backend.log

springdoc:
  swagger-ui:
    path: /swagger-ui.html

  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET:K7gNU3sdo+OL0wNhqoVWhr3g6s1xYv72ol/pe/Unols=}
  expiration: 86400000

timezone:
  identifier: ${TIMEZONE_IDENTIFIER}

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://mosquitto:1883}
  client-id: ${MQTT_CLIENT_ID:iot-backend-subscriber}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  topic: sensors/+/data
  qos: 1
  connection-timeout: 10
  keep-alive-interval: 60
  clean-session: true

sensor:
  threshold:
    temperature:
      max: 30.0
    humidity:
      max: 80.0

alert:
  email:
    recipient: ${ALERT_EMAIL_RECIPIENT:}
    
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name:iot-backend}


